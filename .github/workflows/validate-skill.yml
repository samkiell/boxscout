name: Validate skill discovery

on:
  push:
    branches: [main]
  pull_request:

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify skills CLI discovers boxscout
        run: |
          npx --yes skills add . --list | tee /tmp/boxscout-skills.txt
          grep -qi 'boxscout' /tmp/boxscout-skills.txt
